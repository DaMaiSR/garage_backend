server:
  port: 9999
  servlet:
    context-path: /garage

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/garage_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8
    username: root
    password: 123456
  sql:
    init:
      mode: never
      encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.cqupt.garage.pojo,com.cqupt.garage.dto

config:
  jwt:
    secret: garage123456
    expire: 86400
    header: token

monitor:
  push-interval-ms: 5000

integration:
  access-key: garage-integration-key
  payment:
    provider: mock
    order-expire-minutes: 15
